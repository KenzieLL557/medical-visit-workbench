<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="730" viewBox="0 0 1440 730" role="img" aria-labelledby="title desc">
<title id="title">一次拜访的任务路径</title><desc id="desc">代表、AI 与系统三个泳道。原文和草稿由系统保存；来电中断后，从原卡片继续核实，确认保存后再实际执行后续事项。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#a7b5cd" stroke-width="1.5"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif">
<rect x="1" y="1" width="1438" height="728" rx="24" fill="#fcfdff" stroke="#dce3ee"/>
<text x="40" y="52" font-size="27" fill="#29374e" font-weight="600" text-anchor="start">一次拜访的任务路径</text>
<text x="40" y="87" font-size="17" fill="#7b8799" font-weight="400" text-anchor="start">准备 → 记录 → 核实 → 跟进</text>
<text x="294" y="141" font-size="14" fill="#a0aec5" font-weight="500" text-anchor="middle">01</text>
<text x="294" y="171" font-size="20" fill="#29374e" font-weight="600" text-anchor="middle">访前准备</text>
<text x="493" y="141" font-size="14" fill="#a0aec5" font-weight="500" text-anchor="middle">02</text>
<text x="493" y="171" font-size="20" fill="#29374e" font-weight="600" text-anchor="middle">记录交流</text>
<text x="692" y="141" font-size="14" fill="#a0aec5" font-weight="500" text-anchor="middle">03</text>
<text x="692" y="171" font-size="20" fill="#29374e" font-weight="600" text-anchor="middle">AI 整理</text>
<text x="891" y="141" font-size="14" fill="#a0aec5" font-weight="500" text-anchor="middle">04</text>
<text x="891" y="171" font-size="20" fill="#29374e" font-weight="600" text-anchor="middle">核实修改</text>
<text x="1090" y="141" font-size="14" fill="#a0aec5" font-weight="500" text-anchor="middle">05</text>
<text x="1090" y="171" font-size="20" fill="#29374e" font-weight="600" text-anchor="middle">保存记录</text>
<text x="1289" y="141" font-size="14" fill="#a0aec5" font-weight="500" text-anchor="middle">06</text>
<text x="1289" y="171" font-size="20" fill="#29374e" font-weight="600" text-anchor="middle">后续跟进</text>
<rect x="24" y="200" width="1392" height="109" rx="15" fill="#f9fafc" stroke="none"/>
<text x="56" y="249" font-size="21" fill="#29374e" font-weight="600" text-anchor="start">代表</text>
<rect x="205" y="210" width="178" height="88" rx="12" fill="#ffffff" stroke="#dce3ee"/><text x="294" y="248" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">确认目标</text><text x="294" y="276" font-size="19" fill="#29374e" font-weight="400" text-anchor="middle">核对旧承诺</text>
<rect x="404" y="210" width="178" height="88" rx="12" fill="#ffffff" stroke="#dce3ee"/><text x="493" y="248" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">写下沟通</text><text x="493" y="276" font-size="19" fill="#29374e" font-weight="400" text-anchor="middle">文字 / 访后复述</text>
<rect x="603" y="210" width="178" height="88" rx="12" fill="#ffffff" stroke="#dce3ee"/><text x="692" y="261" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">发起整理</text>
<rect x="802" y="210" width="178" height="88" rx="12" fill="#fffdf9" stroke="#e4c99d"/><text x="891" y="248" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">确认或更正</text><text x="891" y="276" font-size="17" fill="#29374e" font-weight="400" text-anchor="middle">时间 · 需求 · 负责人</text>
<rect x="1001" y="210" width="178" height="88" rx="12" fill="#ffffff" stroke="#dce3ee"/><text x="1090" y="261" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">确认保存</text>
<rect x="1200" y="210" width="178" height="88" rx="12" fill="#ffffff" stroke="#dce3ee"/><text x="1289" y="248" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">线下办理</text><text x="1289" y="276" font-size="19" fill="#29374e" font-weight="400" text-anchor="middle">回来标记完成</text>
<path d="M386 254 H397" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M585 254 H596" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M784 254 H795" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M983 254 H994" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M1182 254 H1193" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<rect x="24" y="342" width="1392" height="109" rx="15" fill="#f4f7fc" stroke="none"/>
<text x="56" y="391" font-size="21" fill="#355bd3" font-weight="600" text-anchor="start">AI</text>
<rect x="205" y="352" width="178" height="88" rx="12" fill="#eef3ff" stroke="#dbe4fb"/><text x="294" y="403" font-size="19" fill="#355bd3" font-weight="500" text-anchor="middle">汇总本次简报</text>
<text x="494" y="404" font-size="22" fill="#c4ccd8" font-weight="400" text-anchor="middle">—</text>
<rect x="603" y="352" width="178" height="88" rx="12" fill="#eef3ff" stroke="#dbe4fb"/><text x="692" y="390" font-size="19" fill="#355bd3" font-weight="500" text-anchor="middle">提取要点</text><text x="692" y="418" font-size="19" fill="#355bd3" font-weight="400" text-anchor="middle">需求与待办</text>
<rect x="802" y="352" width="178" height="88" rx="12" fill="#eef3ff" stroke="#dbe4fb"/><text x="891" y="390" font-size="19" fill="#355bd3" font-weight="500" text-anchor="middle">标出疑点</text><text x="891" y="418" font-size="19" fill="#355bd3" font-weight="400" text-anchor="middle">等待用户判断</text>
<text x="1091" y="404" font-size="22" fill="#c4ccd8" font-weight="400" text-anchor="middle">—</text>
<text x="1290" y="404" font-size="22" fill="#c4ccd8" font-weight="400" text-anchor="middle">—</text>
<path d="M784 396 H795" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<rect x="24" y="484" width="1392" height="109" rx="15" fill="#f9fafc" stroke="none"/>
<text x="56" y="533" font-size="21" fill="#29374e" font-weight="600" text-anchor="start">系统</text>
<rect x="205" y="494" width="178" height="88" rx="12" fill="#f7f9fc" stroke="#dce3ee"/><text x="294" y="532" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">展示历史</text><text x="294" y="560" font-size="19" fill="#29374e" font-weight="400" text-anchor="middle">与资料来源</text>
<rect x="404" y="494" width="178" height="88" rx="12" fill="#f7f9fc" stroke="#dce3ee"/><text x="493" y="532" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">保存原文</text><text x="493" y="560" font-size="19" fill="#29374e" font-weight="400" text-anchor="middle">关联本次拜访</text>
<rect x="603" y="494" width="178" height="88" rx="12" fill="#f7f9fc" stroke="#dce3ee"/><text x="692" y="532" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">保留草稿</text><text x="692" y="560" font-size="19" fill="#29374e" font-weight="400" text-anchor="middle">尚未正式保存</text>
<rect x="802" y="494" width="178" height="88" rx="12" fill="#f7f9fc" stroke="#dce3ee"/><text x="891" y="545" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">保留人工修改</text>
<rect x="1001" y="494" width="178" height="88" rx="12" fill="#f7f9fc" stroke="#dce3ee"/><text x="1090" y="532" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">写入正式记录</text><text x="1090" y="560" font-size="19" fill="#29374e" font-weight="400" text-anchor="middle">关联后续待办</text>
<rect x="1200" y="494" width="178" height="88" rx="12" fill="#f7f9fc" stroke="#dce3ee"/><text x="1289" y="532" font-size="19" fill="#29374e" font-weight="500" text-anchor="middle">更新完成状态</text><text x="1289" y="560" font-size="19" fill="#29374e" font-weight="400" text-anchor="middle">支持撤销</text>
<path d="M386 538 H397" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M585 538 H596" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M784 538 H795" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M983 538 H994" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M1182 538 H1193" stroke="#a7b5cd" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
<path d="M692 584 V628 H891 V584" fill="none" stroke="#b58d58" stroke-width="1.6" stroke-dasharray="6 5"/>
<rect x="605" y="644" width="388" height="43" rx="22" fill="#faf4ea" stroke="#ead9bf"/>
<text x="799" y="672" font-size="17" fill="#957247" font-weight="500" text-anchor="middle">来电离开后，从原卡片继续核实</text>
<text x="42" y="692" font-size="14" fill="#957247" font-weight="400" text-anchor="start">用户判断</text>
