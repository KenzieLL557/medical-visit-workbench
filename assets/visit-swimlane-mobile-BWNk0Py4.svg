<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1530" viewBox="0 0 680 1530" role="img" aria-labelledby="title desc">
<title id="title">一次拜访的任务路径</title><desc id="desc">六阶段的移动版泳道。每个阶段分别列出代表、AI、系统的动作；整理后的中断保留原文和草稿。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 8 5 1 9" fill="none" stroke="#a7b5cd" stroke-width="1.5"/></marker></defs>
<g font-family="-apple-system,BlinkMacSystemFont,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif">
<rect x="1" y="1" width="678" height="1528" rx="24" fill="#fcfdff" stroke="#dce3ee"/>
<text x="32" y="52" font-size="29" fill="#29374e" font-weight="600" text-anchor="start">一次拜访的任务路径</text>
<circle cx="54" cy="124" r="21" fill="#edf2ff"/>
<text x="54" y="132" font-size="22" fill="#355bd3" font-weight="600" text-anchor="middle">1</text>
<rect x="96" y="90" width="548" height="193" rx="15" fill="#ffffff" stroke="#dce3ee"/>
<text x="121" y="126" font-size="25" fill="#29374e" font-weight="600" text-anchor="start">访前准备</text>
<text x="121" y="169" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">代表</text>
<text x="188" y="169" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">确认目标，核对旧承诺</text>
<text x="121" y="212" font-size="21" fill="#355bd3" font-weight="500" text-anchor="start">AI</text>
<text x="188" y="212" font-size="24" fill="#355bd3" font-weight="400" text-anchor="start">汇总本次简报</text>
<text x="121" y="255" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">系统</text>
<text x="188" y="255" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">展示历史，与资料来源</text>
<path d="M54 151 V311" stroke="#a7b5cd" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<circle cx="54" cy="339" r="21" fill="#edf2ff"/>
<text x="54" y="347" font-size="22" fill="#355bd3" font-weight="600" text-anchor="middle">2</text>
<rect x="96" y="305" width="548" height="193" rx="15" fill="#ffffff" stroke="#dce3ee"/>
<text x="121" y="341" font-size="25" fill="#29374e" font-weight="600" text-anchor="start">记录交流</text>
<text x="121" y="384" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">代表</text>
<text x="188" y="384" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">写下沟通，文字 / 访后复述</text>
<text x="121" y="427" font-size="21" fill="#355bd3" font-weight="500" text-anchor="start">AI</text>
<text x="188" y="427" font-size="24" fill="#355bd3" font-weight="400" text-anchor="start">—</text>
<text x="121" y="470" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">系统</text>
<text x="188" y="470" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">保存原文，关联本次拜访</text>
<path d="M54 366 V526" stroke="#a7b5cd" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<circle cx="54" cy="554" r="21" fill="#edf2ff"/>
<text x="54" y="562" font-size="22" fill="#355bd3" font-weight="600" text-anchor="middle">3</text>
<rect x="96" y="520" width="548" height="193" rx="15" fill="#ffffff" stroke="#dce3ee"/>
<text x="121" y="556" font-size="25" fill="#29374e" font-weight="600" text-anchor="start">AI 整理</text>
<text x="121" y="599" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">代表</text>
<text x="188" y="599" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">发起整理</text>
<text x="121" y="642" font-size="21" fill="#355bd3" font-weight="500" text-anchor="start">AI</text>
<text x="188" y="642" font-size="24" fill="#355bd3" font-weight="400" text-anchor="start">提取要点，需求与待办</text>
<text x="121" y="685" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">系统</text>
<text x="188" y="685" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">保留草稿，尚未正式保存</text>
<path d="M54 581 V826" stroke="#a7b5cd" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<rect x="96" y="731" width="548" height="55" rx="14" fill="#faf4ea" stroke="#ead9bf"/>
<text x="370" y="766" font-size="21" fill="#957247" font-weight="500" text-anchor="middle">来电离开 → 从原卡片继续核实</text>
<circle cx="54" cy="854" r="21" fill="#edf2ff"/>
<text x="54" y="862" font-size="22" fill="#355bd3" font-weight="600" text-anchor="middle">4</text>
<rect x="96" y="820" width="548" height="193" rx="15" fill="#ffffff" stroke="#e4c99d"/>
<text x="121" y="856" font-size="25" fill="#29374e" font-weight="600" text-anchor="start">核实修改</text>
<text x="121" y="899" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">代表</text>
<text x="188" y="899" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">确认或更正，时间 · 需求 · 负责人</text>
<text x="121" y="942" font-size="21" fill="#355bd3" font-weight="500" text-anchor="start">AI</text>
<text x="188" y="942" font-size="24" fill="#355bd3" font-weight="400" text-anchor="start">标出疑点，等待用户判断</text>
<text x="121" y="985" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">系统</text>
<text x="188" y="985" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">保留人工修改</text>
<path d="M54 881 V1041" stroke="#a7b5cd" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<circle cx="54" cy="1069" r="21" fill="#edf2ff"/>
<text x="54" y="1077" font-size="22" fill="#355bd3" font-weight="600" text-anchor="middle">5</text>
<rect x="96" y="1035" width="548" height="193" rx="15" fill="#ffffff" stroke="#dce3ee"/>
<text x="121" y="1071" font-size="25" fill="#29374e" font-weight="600" text-anchor="start">保存记录</text>
<text x="121" y="1114" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">代表</text>
<text x="188" y="1114" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">确认保存</text>
<text x="121" y="1157" font-size="21" fill="#355bd3" font-weight="500" text-anchor="start">AI</text>
<text x="188" y="1157" font-size="24" fill="#355bd3" font-weight="400" text-anchor="start">—</text>
<text x="121" y="1200" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">系统</text>
<text x="188" y="1200" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">写入正式记录，关联后续待办</text>
<path d="M54 1096 V1256" stroke="#a7b5cd" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<circle cx="54" cy="1284" r="21" fill="#edf2ff"/>
<text x="54" y="1292" font-size="22" fill="#355bd3" font-weight="600" text-anchor="middle">6</text>
<rect x="96" y="1250" width="548" height="193" rx="15" fill="#ffffff" stroke="#dce3ee"/>
<text x="121" y="1286" font-size="25" fill="#29374e" font-weight="600" text-anchor="start">后续跟进</text>
<text x="121" y="1329" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">代表</text>
<text x="188" y="1329" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">线下办理，回来标记完成</text>
<text x="121" y="1372" font-size="21" fill="#355bd3" font-weight="500" text-anchor="start">AI</text>
<text x="188" y="1372" font-size="24" fill="#355bd3" font-weight="400" text-anchor="start">—</text>
<text x="121" y="1415" font-size="21" fill="#7b8799" font-weight="500" text-anchor="start">系统</text>
<text x="188" y="1415" font-size="24" fill="#29374e" font-weight="400" text-anchor="start">更新完成状态，支持撤销</text>
</g></svg>